<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURIXIS — Live Symbol Feed</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #050914;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 680px;
      margin: 0 auto;
      background: #0f1b33;
      border: 1px solid rgba(96, 165, 250, 0.25);
      border-radius: 14px;
      padding: 20px;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 14px 0 20px;
    }
    select, button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: #132240;
      color: #f8fafc;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button.primary {
      background: #2563eb;
      border-color: #60a5fa;
      font-weight: 600;
    }
    .stat {
      background: #081022;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
    }
    .muted { color: #94a3b8; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="box">
    <h2>AURIXIS Live Symbol Selector</h2>
    <p class="muted">Fetches live data from your backend endpoint <code>/api/quote</code>. Never uses hardcoded prices or signals.</p>

    <div class="controls">
      <select id="symbolSelect" aria-label="Select Symbol">
        <option value="XAUUSD">XAUUSD (Gold)</option>
        <option value="EURUSD">EURUSD</option>
        <option value="GBPUSD">GBPUSD</option>
        <option value="BTCUSD">BTCUSD</option>
      </select>
      <button class="primary" id="loadBtn" type="button">Fetch Live Quote</button>
    </div>

    <div class="stat">
      <div><strong>Symbol:</strong> <span id="outSymbol">XAUUSD</span></div>
      <div><strong>Price:</strong> <span id="outPrice">Awaiting live feed...</span></div>
      <div><strong>Status:</strong> <span id="outStatus">Not fetched yet</span></div>
    </div>
  </div>

  <script>
    const symbolSelect = document.getElementById("symbolSelect");
    const loadBtn = document.getElementById("loadBtn");
    const outSymbol = document.getElementById("outSymbol");
    const outPrice = document.getElementById("outPrice");
    const outStatus = document.getElementById("outStatus");

    async function fetchLiveSymbol() {
      const symbol = symbolSelect.value;
      outSymbol.textContent = symbol;
      outStatus.textContent = "Requesting live data...";
      outPrice.textContent = "--";

      try {
        const res = await fetch(`/api/quote?symbol=${encodeURIComponent(symbol)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (!data || data.price === undefined || data.price === null) {
          outPrice.textContent = "Unavailable";
          outStatus.textContent = "Backend returned no live price";
          return;
        }

        outPrice.textContent = String(data.price);
        outStatus.textContent = data.source ? `Live (${data.source})` : "Live feed connected";
      } catch (err) {
        outPrice.textContent = "Unavailable";
        outStatus.textContent = `Live feed not connected (${err.message})`;
      }
    }

    loadBtn.addEventListener("click", fetchLiveSymbol);
    symbolSelect.addEventListener("change", fetchLiveSymbol);
  </script>
</body>
</html>
